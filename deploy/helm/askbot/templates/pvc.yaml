{{- if not .Values.orchestrator.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "askbot.fullname" . }}-state
  labels:
    {{- include "askbot.labels" (dict "root" . "component" "orchestrator") | nindent 4 }}
  annotations:
    # The database, vault, sessions and sign-ins outlive `helm uninstall`; a reinstall with the same release name adopts them.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.orchestrator.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.orchestrator.persistence.size }}
{{- end }}
